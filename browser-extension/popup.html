<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 300px; margin: 0; padding: 14px; font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #1f2328; }
      h1 { margin: 0 0 10px; font-size: 14px; }
      label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; margin-top: 8px; }
      code { font: 12px ui-monospace, SFMono-Regular, monospace; }
      button { width: 100%; margin-top: 12px; padding: 7px 10px; border-radius: 6px; border: 1px solid #d1d9e0; background: #f6f8fa; font: inherit; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      p { margin: 10px 0 0; color: #59636e; font-size: 12px; line-height: 1.4; }
      [hidden] { display: none !important; }
      @media (prefers-color-scheme: dark) {
        body { background: #151b23; color: #f0f6fc; }
        button { background: #212830; border-color: #3d444d; color: #f0f6fc; }
        p { color: #9198a1; }
      }
    </style>
  </head>
  <body>
    <h1>Open in PR Review</h1>
    <label id="repo-row" hidden><input id="repo" type="checkbox" /> <span>Open <code id="repo-name"></code> pull requests in PR Review</span></label>
    <label><input id="auto" type="checkbox" /> <span id="auto-label">Open GitHub pull requests in PR Review</span></label>
    <label><input id="button" type="checkbox" /> <span>Show an &ldquo;Open in PR Review&rdquo; button on pull requests</span></label>
    <button id="open" type="button" disabled>Open this pull request in PR Review</button>
    <p>Links that PR Review opens in the browser itself, like "View on GitHub", stay here.</p>
    <script src="popup.js"></script>
  </body>
</html>
